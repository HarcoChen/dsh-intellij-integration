changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: "🚀 Features"
      labels:
        - feature
    - title: "🐛 Bug Fixes"
      labels:
        - bug
    - title: "📚 Documentation"
      labels:
        - documentation
    - title: "⚡ Performance"
      labels:
        - performance
    - title: "🔧 Maintenance"
      labels:
        - chore
        - ci
        - refactor
        - style
        - test
        - revert
    - title: "Other Changes"
      labels:
        - "*"
