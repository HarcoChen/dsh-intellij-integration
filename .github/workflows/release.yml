name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish"
        required: true
        type: string

permissions:
  contents: write

# Releases must not overlap: a cancelled publish can leave the Marketplace and
# the GitHub release disagreeing about what shipped.
concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Gradle consumes credentials from the environment without writing secret
    # material to the checkout.
    env:
      PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
      CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          # gradle.properties is the single source of truth; patchPluginXml
          # writes this value into plugin.xml at build time.
          VERSION="$(sed -n 's/^pluginVersion=//p' gradle.properties | tr -d '[:space:]')"
          TAG="${{ inputs.tag || github.ref_name }}"

          if [[ -z "${VERSION}" ]]; then
            echo "gradle.properties declares no pluginVersion." >&2
            exit 1
          fi
          if [[ "${TAG}" != "v${VERSION}" ]]; then
            echo "Tag ${TAG} does not match gradle.properties pluginVersion v${VERSION}." >&2
            exit 1
          fi

          # A SemVer prerelease (0.3.0-beta.1) is not for the general channel.
          # It still produces a downloadable artifact and a pre-release GitHub
          # release; on the Marketplace it goes to the channel its identifier
          # names, which users opt into rather than upgrade into.
          PRERELEASE=false
          if [[ "${VERSION}" == *-* ]]; then
            PRERELEASE=true
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${PRERELEASE}" >> "${GITHUB_OUTPUT}"

      - name: Validate publishing secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in PUBLISH_TOKEN CERTIFICATE_CHAIN PRIVATE_KEY PRIVATE_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("${name}")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "Missing required GitHub Actions secrets: ${missing[*]}" >&2
            exit 1
          fi

      - name: Build, verify, sign, and verify signature
        run: ./gradlew clean buildPlugin verifyPlugin signPlugin verifyPluginSignature

      - name: Resolve the distribution to release
        id: artifact
        shell: bash
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          BASE="build/distributions/dsh-intellij-integration-${VERSION}"
          # The signed archive is what publishPlugin uploads and what the GitHub
          # release carries, so both channels ship identical bytes.
          if [[ -f "${BASE}-signed.zip" ]]; then
            ARCHIVE="${BASE}-signed.zip"
            echo "Signed archive selected."
          else
            echo "No signed distribution produced for ${VERSION}, found:" >&2
            ls -1 build/distributions >&2 || true
            exit 1
          fi
          echo "archive=${ARCHIVE}" >> "${GITHUB_OUTPUT}"

      - name: Publish to JetBrains Marketplace
        # Marketplace versions cannot be overwritten, so publish only after the
        # build, compatibility checks, signing, and signature verification pass.
        run: ./gradlew publishPlugin

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: ${{ steps.artifact.outputs.archive }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ steps.metadata.outputs.prerelease == 'true' }}
