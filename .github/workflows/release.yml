name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish"
        required: true
        type: string

permissions:
  contents: write

# Releases must not overlap: a cancelled publish can leave the Marketplace and
# the GitHub release disagreeing about what shipped.
concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # The `secrets` context cannot be read from a step's `if`, so the publish
    # credentials are lifted to the job environment and tested through `env`.
    # signPlugin already reads the certificate variables from the environment.
    env:
      PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
      CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          # gradle.properties is the single source of truth; patchPluginXml
          # writes this value into plugin.xml at build time.
          VERSION="$(sed -n 's/^pluginVersion=//p' gradle.properties | tr -d '[:space:]')"
          TAG="${{ inputs.tag || github.ref_name }}"

          if [[ -z "${VERSION}" ]]; then
            echo "gradle.properties declares no pluginVersion." >&2
            exit 1
          fi
          if [[ "${TAG}" != "v${VERSION}" ]]; then
            echo "Tag ${TAG} does not match gradle.properties pluginVersion v${VERSION}." >&2
            exit 1
          fi

          # A SemVer prerelease (0.3.0-beta.1) is not for the general channel.
          # It still produces a downloadable artifact and a pre-release GitHub
          # release; on the Marketplace it goes to the channel its identifier
          # names, which users opt into rather than upgrade into.
          PRERELEASE=false
          if [[ "${VERSION}" == *-* ]]; then
            PRERELEASE=true
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${PRERELEASE}" >> "${GITHUB_OUTPUT}"

      - name: Build, verify, and sign plugin
        # signPlugin skips itself when the certificate secrets are absent, so
        # this is the same command with or without signing configured.
        run: ./gradlew clean buildPlugin verifyPlugin signPlugin

      - name: Resolve the distribution to release
        id: artifact
        shell: bash
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          BASE="build/distributions/dsh-intellij-integration-${VERSION}"
          # The signed archive is what publishPlugin uploads, so it must also be
          # what the GitHub release carries — otherwise the two would ship
          # different bytes under one version.
          if [[ -f "${BASE}-signed.zip" ]]; then
            ARCHIVE="${BASE}-signed.zip"
            echo "Signed archive selected."
          elif [[ -f "${BASE}.zip" ]]; then
            ARCHIVE="${BASE}.zip"
            echo "::warning::Publishing an UNSIGNED plugin; set CERTIFICATE_CHAIN, PRIVATE_KEY and PRIVATE_KEY_PASSWORD to sign it."
          else
            echo "No distribution produced for ${VERSION}, found:" >&2
            ls -1 build/distributions >&2 || true
            exit 1
          fi
          echo "archive=${ARCHIVE}" >> "${GITHUB_OUTPUT}"

      - name: Publish to JetBrains Marketplace
        # Publishing is irreversible for a given version, so it only runs for a
        # tag push or an explicit dispatch that carries a token. signPlugin
        # signs the archive when the certificate secrets exist and skips itself
        # when they do not, in which case the unsigned archive is published.
        if: env.PUBLISH_TOKEN != ''
        run: ./gradlew publishPlugin

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: ${{ steps.artifact.outputs.archive }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ steps.metadata.outputs.prerelease == 'true' }}
